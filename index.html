<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<meta name="description" content="L'univers en 3D et en zoom continu, du système solaire aux quasars.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>COSMOS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : la scène 3D occupe tout l'écran ; l'interface est un instrument posé dessus —
   identité de l'astre en haut à gauche, fiche éphéméride repliable, rail des astres et barre de temps en bas. */
:root{
  color-scheme:dark;
  --void:#04060b;            /* fond spatial */
  --glass:rgba(9,13,22,.66); /* panneaux */
  --line:rgba(160,185,230,.16);
  --fg:#e8eef8;
  --dim:#8f9bb3;
  --sun:#ffb84d;             /* accent : lumière solaire */
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--void);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);opacity:.8;white-space:nowrap;padding:8px 6px;pointer-events:auto;cursor:pointer;background:none;border:0;text-shadow:0 0 6px #000,0 0 2px #000;will-change:transform}
.lb.moon{font-size:10px;color:var(--dim)}
.lb.far{font-size:10px;letter-spacing:.1em;opacity:.62}
#tabs{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 0}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);background:none;border:0;border-bottom:1px solid transparent;padding:8px 0 6px;cursor:pointer;text-shadow:0 0 6px #000}
.tab[aria-pressed="true"]{color:var(--sun);border-bottom-color:var(--sun)}
.lb:hover{opacity:1;color:var(--sun)}
.ui{position:fixed;left:0;right:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px}
.ui>*{pointer-events:auto}
#top{top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));justify-content:space-between;align-items:flex-start}
#ident{pointer-events:none;min-width:0}
#brand{font:500 10px/1 var(--mono);letter-spacing:.32em;color:var(--sun);margin-bottom:10px}
#name{font:600 clamp(22px,5.4vw,40px)/1.05 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
#kind{font-size:13px;color:var(--dim);margin-top:6px}
#range{font:400 12px/1.4 var(--mono);color:var(--fg);margin-top:6px;font-variant-numeric:tabular-nums}
#tools{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:min(62%,460px)}
.tb{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 12px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tb[aria-pressed="true"]{border-color:var(--sun);color:var(--sun)}
button:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#bottom{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:8px}
#sheet{box-sizing:border-box;align-self:flex-end;width:min(340px,100%);max-height:min(46vh,430px);overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-user-select:text;user-select:text}
#sheet p{margin:0 0 12px;font-size:13px;line-height:1.5;color:var(--fg)}
#sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12px}
#sheet dt{color:var(--dim)}
#sheet dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
#sheet .note{margin:12px 0 0;font-size:11px;color:var(--dim)}
#rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
#rail::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;font:500 12px/1 var(--body);color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 12px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.moon{font-size:11px;padding:9px 10px;color:var(--dim)}
.chip.moon i{width:5px;height:5px}
.chip[aria-current="true"]{border-color:var(--sun);color:var(--sun)}
#time{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 10px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#clock{flex:1 1 150px;min-width:0}
#date{font:500 14px/1.2 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rate{font-size:11px;color:var(--sun);margin-top:3px;font-family:var(--mono);letter-spacing:.04em}
.tc{display:flex;gap:4px;align-items:center}
.tc button{font:500 13px/1 var(--mono);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:9px;min-width:38px;height:36px;padding:0 9px;cursor:pointer}
.tc button:active{background:rgba(255,184,77,.15)}
#now{font-size:11px;letter-spacing:.05em;text-transform:uppercase}
#jump{font:400 12px var(--mono);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:9px;height:36px;padding:0 6px;max-width:128px}
#panel{position:fixed;top:60px;right:max(16px,env(safe-area-inset-right,0px));width:min(330px,calc(100% - 32px));max-height:min(58vh,460px);overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 12px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:5}
#q{width:100%;box-sizing:border-box;font:400 14px var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:9px;height:38px;padding:0 10px;margin-bottom:4px;-webkit-user-select:text;user-select:text}
.it{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:11px 4px;font:500 13px/1.3 var(--body);cursor:pointer}
.it:last-child{border-bottom:0}
.it span{font-size:11px;font-weight:400;color:var(--dim);text-align:right}
.it.col{flex-direction:column;gap:4px}
.it.col span{text-align:left}
.it:hover{color:var(--sun)}
#panel .note{margin:10px 4px;font-size:12px;color:var(--dim)}
#hint{align-self:center;font:500 11px/1.4 var(--mono);letter-spacing:.03em;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 14px;text-align:center;pointer-events:none}
#cap{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);max-width:640px}
#capBar{position:absolute;left:0;right:0;top:0;height:2px}
#capBar i{display:block;height:100%;background:var(--sun);transform-origin:left;transform:scaleX(0)}
#capTop{display:flex;justify-content:space-between;align-items:center;gap:10px}
#capN{font:500 10px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sun);min-width:0}
#capT{margin:8px 0 0;font-size:15px;line-height:1.5;text-wrap:pretty}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--void);font:500 11px var(--mono);letter-spacing:.3em;color:var(--sun);transition:opacity .8s;pointer-events:none;text-align:center;padding:0 24px}
#load.off{opacity:0}
@media (max-width:560px){ .tb{padding:9px 10px;font-size:10px} #sheet{width:100%;max-height:36vh} }
@media (prefers-reduced-motion:reduce){ #load{transition:none} }
</style>
</head>

<canvas id="gl" tabindex="0" aria-label="Vue 3D du système solaire"></canvas>

      <button id="now">Maintenant</button>
      <input type="date" id="jump" aria-label="Aller à une date">

  </div>
</div>

function tourShow(){const st=tour.T.st[tour.i],b=byId[st[0]];$('capN').textContent=tour.T.n+' · '+(tour.i+1)+' / '+tour.T.st.length;$('capT').textContent=st[1];

window.addEventListener('hashchange',()=>{const b=byId[location.hash.slice(1)];if(b&&b!==S.focus)setFocus(b)});
setTimeout(()=>{$('hint').hidden=true},15000);

/* ---- gestes : glisser = tourner, molette / pincement = zoom, toucher un astre = s'y rendre ---- */
const ptrs=new Map();let moved=0,pinch=0,downT=0;

const MAXD=6e9*LY;
function zoom(f){S.distT=Math.min(MAXD,Math.max(minDist(S.focus),S.distT*f))}
function pick(x,y){let best=null,bd=1e9;B.forEach(b=>{if(!b.onScreen||!b.shown)return;const pk=b.flat?Math.min(b.px,30):b.px,d=Math.hypot(b.sx-x,b.sy-y),lim=Math.max(pk,26);if(d<lim&&d-pk<bd){bd=d-pk;best=b}});if(best)setFocus(best)}

function resize(){const w=window.innerWidth,h=window.innerHeight;S.W=w;S.H=h;renderer.setSize(w,h,false);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();

/* ============ boucle ============ */
const qT=new THREE.Quaternion(),vT=new THREE.Vector3(),vS=new THREE.Vector3(),m4=new THREE.Matrix4(),fwd=new THREE.Vector3();
const ease=t=>t*t*t*(t*(6*t-15)+10),sat=x=>x<0?0:x>1?1:x,FARC=2e9;
const texLoader=new THREE.TextureLoader(),PIL=byId.piliers,AIG=byId.aigle;
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;clockU.value+=dt;
  if(!S.paused)S.d+=RATES[S.ri]*dt/86400;
  const d=S.d;
  B.forEach(b=>bodyPos(b,d,b.pos));
  if(tour){if(!ptrs.size&&!reduce)S.yaw+=dt*.04;if(!tour.hold&&S.tr>=1){tour.el+=dt;if(tour.el>=tour.dur)tourStep(1)}if(tour)capBar.style.transform='scaleX('+Math.min(1,tour.el/tour.dur).toFixed(3)+')'}
  // --- caméra
  if(!ptrs.size){S.yaw+=S.vy;S.pitch=Math.max(-1.5,Math.min(1.5,S.pitch+S.vp));S.vy*=.92;S.vp*=.92}
  const f=S.focus;let extra=0;
  if(S.tr<1){S.tr=Math.min(1,S.tr+dt/S.trDur);const s=ease(S.tr),p0=S.prev.pos,p1=f.pos;for(let k=0;k<3;k++)fp[k]=p0[k]+(p1[k]-p0[k])*s;
    S.dist=Math.exp(Math.log(S.d0)+(Math.log(S.distT)-Math.log(S.d0))*s);extra=S.sep*.85*Math.pow(Math.sin(Math.PI*s),2)}
  else{fp[0]=f.pos[0];fp[1]=f.pos[1];fp[2]=f.pos[2];S.dist=Math.exp(Math.log(S.dist)+(Math.log(S.distT)-Math.log(S.dist))*Math.min(1,dt*7))}
  const D=S.dist+extra,cp=Math.cos(S.pitch);
  vT.set(cp*Math.sin(S.yaw),Math.sin(S.pitch),cp*Math.cos(S.yaw));
  camPos[0]=fp[0]+vT.x*D;camPos[1]=fp[1]+vT.y*D;camPos[2]=fp[2]+vT.z*D;
  camera.position.set(0,0,0);camera.up.set(0,1,0);camera.lookAt(-vT.x,-vT.y,-vT.z);
  camera.near=Math.min(1e5,Math.max(1e-4,f.flat?D*.01:(D-f.Rm)*.02));camera.far=1e17;camera.updateProjectionMatrix();camera.updateMatrixWorld(true);
  fwd.set(-vT.x,-vT.y,-vT.z);
  const pxK=S.H/2/Math.tan(camera.fov*D2R/2);
  // --- changement d'échelle : le ciel fixe laisse place à la galaxie en volume entre 3 000 et 20 000 al du Soleil
  const camSun=Math.hypot(camPos[0],camPos[1],camPos[2]),gf=sat((Math.log10(camSun+1)-13.45)/.83),sky=1-gf;
  starMat.uniforms.uFade.value=sky;milky.material.uniforms.uFade.value=sky;milky.visible=sky>.003;if(stars)stars.visible=sky>.003;
  // --- astres
  B.forEach((b,i)=>{b.rel.set(b.pos[0]-camPos[0],b.pos[1]-camPos[1],b.pos[2]-camPos[2]);b.dist=b.rel.length();b.px=b.Rm/b.dist*pxK;
    const z=b.rel.dot(fwd);b.onScreen=z>0;
    if(b.onScreen){vS.copy(b.rel).project(camera);b.sx=(vS.x*.5+.5)*S.W;b.sy=(-vS.y*.5+.5)*S.H;b.onScreen=b.sx>-60&&b.sx<S.W+60&&b.sy>-60&&b.sy<S.H+60}
    const an=b.par||(b!==SUN&&b.inMW?SUN:null);
    b.sepPx=an?(b.onScreen&&an.onScreen?Math.hypot(b.sx-an.sx,b.sy-an.sy):999):999;
    const kc=b.dist>FARC?FARC/b.dist:1;mkPos[i*3]=b.rel.x*kc;mkPos[i*3+1]=b.rel.y*kc;mkPos[i*3+2]=b.rel.z*kc;let ma=0;
    if(b.kind==='bh'){const big=b.px*b.disc[1];ma=.75*(1-sat((big-1.5)/3));const vis=big>1.2;b.mesh.visible=vis;
      if(vis){const q=(b.disc[1]+10)*b.Rm*kc;b.mesh.position.copy(b.rel).multiplyScalar(kc);b.mesh.quaternion.copy(camera.quaternion);b.mesh.scale.set(q,q,1);
        b.mat.uniforms.uRo.value.set(-(b.pos[0]-camPos[0])/b.Rm,-(b.pos[1]-camPos[1])/b.Rm,-(b.pos[2]-camPos[2])/b.Rm)}
    }else if(b.flat){
      if(b.img){let a=(sat(b.px/40)*.75+.25)*sat(b.dist/(b.Rm*.03)-.3);if(b===PIL)a=sat((b.px-30)/80);if(b===AIG)a*=1-sat((PIL.px-40)/70);
        if(!b.tex&&!b.loading&&(b.px>3||b===f)){b.loading=1;texLoader.load('img-'+b.img+'.jpg',t=>{t.anisotropy=maxA;b.tex=t;b.mat.uniforms.tImg.value=t})}
        const vis=!!b.tex&&a>.004&&b.px>.4;b.mesh.visible=vis;
        if(vis){const k=b.dist>FARC?FARC/b.dist:1;b.mesh.position.copy(b.rel).multiplyScalar(k);b.mesh.quaternion.copy(camera.quaternion);b.mesh.scale.set(b.Rm*k,b.Rm*k/b.asp,1);b.mat.uniforms.uA.value=a}
        if(b.cat==='neb')ma=.5*(1-sat((b.px-1)/3))*sky}
    }else{
      const vis=b.px>.35;b.mesh.visible=vis;
      if(b.kind==='sun'){ // de loin, l'étoile devient un point lumineux ; de près, une sphère et sa couronne
        const far=sat(Math.log10(b.dist/(b.Rm*(b.ns?4e5:2500))));ma=b.cat==='ext'?far*.7:far*(.35+.65*sky)*(b===SUN?.8:(1-sat((Math.log10(b.dist/LY+1)-2.6)/1.1))*sat((b.sepPx-3)/8+(b===f?1:0)));b.ma=ma;
        const cs=Math.max(b.Rm*30,b.dist*.085*(1-far));b.cor.visible=far<.999;
        if(b.cor.visible){b.cor.position.copy(b.rel);b.cor.quaternion.copy(camera.quaternion);b.cor.scale.set(cs,cs,1);b.cor.material.uniforms.uK.value=cs/2/b.Rm}
      }else{ma=1-sat((b.px-1.2)/2.5);ma*=sat((b.sepPx-5)/10);if(b.mo)ma*=.7}
      if(vis){b.mesh.position.copy(b.rel);bodyQuat(b,d,b.mesh.quaternion);b.mat.uniforms.uRot.value.setFromMatrix4(m4.makeRotationFromQuaternion(b.mesh.quaternion));
        if(b.kind!=='sun'){const u=b.mat.uniforms,st=b.star.pos,dx=st[0]-b.pos[0],dy=st[1]-b.pos[1],dz=st[2]-b.pos[2];
          u.uSun.value.set(dx,dy,dz).normalize();u.uSunAng.value=b.star.Rm/Math.hypot(dx,dy,dz);u.uPx.value=b.px;
          const oc=u.uOcc.value;let n=0;
          if(b.mo&&!b.exo){oc[n++].set(b.par.pos[0]-b.pos[0],b.par.pos[1]-b.pos[1],b.par.pos[2]-b.pos[2],b.par.Rm*(b.par.obl||1))}
          else if(!b.mo)for(let k=0;k<b.kids.length&&n<4;k++){const m=b.kids[k];if(m.R>150)oc[n++].set(m.pos[0]-b.pos[0],m.pos[1]-b.pos[1],m.pos[2]-b.pos[2],m.Rm)}
          for(;n<4;n++)oc[n].w=0;
          if(b.ring===2)u.uRing.value.z=Math.min(2,b.dist/pxK*1.2)}}
      if(b.amesh){b.amesh.visible=b.px>3;b.amesh.position.copy(b.rel)}
      if(b.rmesh){b.rmesh.visible=b.px>.6;b.rmesh.position.copy(b.rel)}
    }
    mkCol[i*4]=b.lc.r;mkCol[i*4+1]=b.lc.g;mkCol[i*4+2]=b.lc.b;mkCol[i*4+3]=ma;
  });
  mkG.attributes.position.needsUpdate=true;mkG.attributes.aCol.needsUpdate=true;
  // --- jets relativistes et faisceaux des pulsars
  B.forEach(b=>{if(!b.jets)return;const L=b.jet.len,vis=L/b.dist*pxK>2;let ax=b.axis;
    if(vis&&b.ns){const a=clockU.value*TAU/b.ns.Pv;qT.setFromAxisAngle(YAX,a);ax=vT.set(.62,.78,0).applyQuaternion(qT).normalize();qT.setFromUnitVectors(YAX,b.axis);ax.applyQuaternion(qT)}
    const kc=b.dist>FARC?FARC/b.dist:1;
    const ji=b.jet.I*sat((b.dist/(L*b.jet.w)-.2)/.8);
    b.jets.forEach(m=>{m.visible=vis&&ji>.01;if(!m.visible)return;m.material.uniforms.uI.value=ji;m.position.copy(b.rel).multiplyScalar(kc);vS.copy(ax).multiplyScalar(m.userData.sg);m.quaternion.setFromUnitVectors(YAX,vS);m.scale.set(L*b.jet.w*kc,L*kc,L*b.jet.w*kc)})});
  // --- Voie lactée en volume

  if(galaxy.visible){const k=MW.dist>FARC?FARC/MW.dist:1;galaxy.position.copy(MW.rel).multiplyScalar(k);galaxy.scale.setScalar(k);galU.uK.value=k;galU.uFade.value=gf;galU.uDim.value=sat(Math.pow(MW.px/380,2))}
  beltMat.uniforms.uD.value=d;beltMat.uniforms.uFade.value=Math.min(1,Math.max(.25,D/3e4))*(1-sat(Math.log10(SUN.dist+1)-8.3));belt.visible=beltMat.uniforms.uFade.value>.004;
  // --- orbites
  B.forEach(b=>{if(!b.ol)return;const sysOk=!b.mo||b.sys===f.sys||b.par.px>.5;
    if(!(S.orbits&&sysOk)){b.ol.visible=false;return}
    const ref=b.mo?b.mo[0]/1000:b.el[0]*AU,rpx=ref/b.par.dist*pxK;let o=sat((b.dist/b.Rm-25)/200);
    if(b.mo)o*=sat((rpx-10)/30)*(b.exo?.4:.26);else o*=.38*sat((rpx-5)/20);
    o*=sat((D/ref-.006)/.06);

    b.ol.position.copy(b.par.rel);buildOrbit(b,d)});
  // --- noms
  B.forEach(b=>{const e=b.lb;let show=b.onScreen&&!(b===f&&b.px*(b.kind==='bh'?8:1)>18&&S.tr>=1);
    if(show&&b.mo)show=b.sys===f.sys&&b.sepPx>34&&b.par.px>.8;
    else if(show&&b!==SUN&&b!==f&&b!==MW)show=b.sepPx>28&&(b.cat!=='gal'||b.px>2)&&(b.cat!=='ext'||b.inMW||b.px*20>1||gf>.9);
    if(show&&b===MW)show=gf>.5&&b.px<S.H*.2;
    if(show&&b.inMW&&b!==f&&b!==MW&&MW.px<140&&gf>.5)show=false;
    if(show&&b.kind==='sun'&&b!==f&&(b===SUN?gf>.5&&MW.px<60:b.ma<.06))show=false;
    if(show&&b.cat==='sol'&&!b.mo&&b!==SUN&&gf>.01)show=false;
    if(show&&b!==f&&!f.flat&&b.dist>f.dist&&Math.hypot(b.sx-f.sx,b.sy-f.sy)<f.px)show=false;
    if(show&&b!==f&&f.onScreen&&Math.hypot(b.sx-f.sx,b.sy-f.sy)<24)show=false;
    b.shown=show||b.px>3;show=show&&S.labels;
    if(show){e.hidden=false;const o=b.flat?10:Math.min(b.px,400)*.72+4;e.style.transform='translate('+(b.sx+o).toFixed(1)+'px,'+(b.sy-10-o).toFixed(1)+'px)'}else if(!e.hidden)e.hidden=true});
  composer.render();
  // --- lectures (4 fois par seconde)
  acc+=dt;if(acc>.25){acc=0;$('range').textContent='à '+fDist((f.flat?f.dist:f.dist-f.Rm)*1000);renderClock();if(S.info)renderSheet(false)}
  requestAnimationFrame(frame)}

/* ============ démarrage ============ */
B.forEach(b=>bodyPos(b,S.d,b.pos));
(function(){const e=EARTH.pos;S.yaw=Math.atan2(-e[0],-e[2])+1.05;S.pitch=.24})(); // Soleil à ~60° de l'axe de visée : terminateur visible

load('earth-day.jpg','day','tDay');load('earth-night.jpg','night','tNight');load('earth-water.png','water','tWater');load('earth-clouds.jpg','cloud','tCloud');
setTimeout(()=>$('load').classList.add('off'),9000);
fetch('stars.json').then(r=>r.json()).then(buildStars).catch(()=>{});

})();
